<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apa Nak Makan?</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-shell">
    <section class="hero" aria-labelledby="page-title">
      <div class="hero-copy">
        <p class="eyebrow">Lunch idea picker</p>
        <h1 id="page-title">Apa Nak Makan?</h1>
        <p class="subtitle">Let us help you decide your next lunch.</p>
      </div>

      <div class="mascot-card" aria-label="Hungry-to-happy mascot placeholder">
        <div class="mascot-face" aria-hidden="true">
          <span class="mascot-eye"></span>
          <span class="mascot-mouth"></span>
          <span class="mascot-eye"></span>
        </div>
        <p>Hungry now. Happy after lunch.</p>
      </div>
    </section>

    <section class="picker-panel" aria-labelledby="picker-title">
      <div class="section-heading">
        <p class="eyebrow">Random lunch picker</p>
        <h2 id="picker-title">Pick a mood, then let lunch happen.</h2>
      </div>

      <div class="category-list" aria-label="Lunch categories">
        <button class="category-btn is-active" type="button" data-category="all">All</button>
        <button class="category-btn" type="button" data-category="budget">Murah &amp; Jimat</button>
        <button class="category-btn" type="button" data-category="spicy">Pedas Meletup</button>
        <button class="category-btn" type="button" data-category="local">Local Favourite</button>
        <button class="category-btn" type="button" data-category="noodles">Noodles</button>
        <button class="category-btn" type="button" data-category="western">Western</button>
        <button class="category-btn" type="button" data-category="rice">Rice Meal</button>
      </div>

      <button id="suggest-btn" class="primary-btn" type="button">Get a Lunch Suggestion</button>

      <article id="result-card" class="result-card" aria-live="polite">
        <p class="result-label">Today sounds like...</p>
        <h3 id="suggestion">Tap the button to start.</h3>
        <p id="suggestion-note">Choose any category or keep it open with All.</p>
        <a id="map-link" class="map-link is-hidden" href="#" target="_blank" rel="noopener noreferrer">Find Nearby Location</a>
      </article>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
